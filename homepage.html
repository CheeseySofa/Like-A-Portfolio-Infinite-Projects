<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Like A Portfolio: Infinite Projects</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- page transition: must stay in the <head> -->
    <script src="js/nav.js"></script>
</head>
<body>
    <!-- Animated background elements -->
    <div class="bg-rays"></div>
    <div class="bg-pattern"></div>
    <div class="bg-vignette"></div>
    <div class="bg-beam"></div>

    <!-- Subtle fog at the very bottom -->
    <div class="fog-container">
        <div class="fog fog-1"></div>
        <div class="fog fog-2"></div>
        <div class="fog fog-3"></div>
        <div class="fog fog-4"></div>
        <div class="fog fog-5"></div>
    </div>

    <!-- Sparks from top -->
    <div class="sparks-container">
        <div class="spark spark-1"></div>
        <div class="spark spark-2"></div>
        <div class="spark spark-3"></div>
        <div class="spark spark-4"></div>
        <div class="spark spark-5"></div>
        <div class="spark spark-6"></div>
        <div class="spark spark-7"></div>
        <div class="spark spark-8"></div>
    </div>

    <!-- Title at top center with kanji above -->
    <div class="game-title">
        <div class="title-kanji">龍</div>
        <div class="title-main">
            <div class="title-like-line">LIKE <span class="red-a">A</span></div>
            <span class="title-portfolio">PORTFOLIO:</span>
        </div>
        <div class="title-subtitle">
            <span class="title-infinite">INFINITE</span>
            <span class="title-projects">PROJECTS</span>
        </div>
    </div>

    <!-- Character Section - Bottom Right with HP above and MP below -->
    <div class="character-section">
        <!-- Star containing image with HP above and MP below -->
        <div class="character-star-frame">
            <!-- HP section - lower half of star -->
            <div class="hp-section">
                <div class="hp-value">1000</div>
                <div class="hp-bar">
                    <div class="hp-fill"></div>
                </div>
            </div>

            <!-- Black star with yellow glow -->
            <div class="star-bg">★</div>

            <!-- Level tag -->
            <div class="level-badge"><span class="lv">Lv.</span><span class="lv-num">14</span></div>

            <!-- Character image at center of star -->
            <div class="portrait">
                <img src="images/thegoat.png" alt="Character" class="character-image">
            </div>

            <!-- MP section - under HP -->
            <div class="mp-section">
                <div class="mp-value">420</div>
                <div class="mp-bar">
                    <div class="mp-fill"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Diamond Menu Buttons - Bottom Left -->
    <nav class="menu-buttons">
        <div class="diamond-grid">
            <!-- Top -->
            <div class="diamond-btn-wrapper top">
                <button class="diamond-btn" data-page="projects">
                    <div class="diamond-shape"></div>
                    <div class="btn-content">
                        <span class="btn-text-en">PROJECTS</span>
                        <span class="btn-text-jp">プロジェクト</span>
                    </div>
                </button>
            </div>

            <!-- Left -->
            <div class="diamond-btn-wrapper left">
                <button class="diamond-btn" data-page="contact">
                    <div class="diamond-shape"></div>
                    <div class="btn-content">
                        <span class="btn-text-en">CONTACT</span>
                        <span class="btn-text-jp">連絡</span>
                    </div>
                </button>
            </div>

            <!-- Right -->
            <div class="diamond-btn-wrapper right">
                <button class="diamond-btn" data-page="skills">
                    <div class="diamond-shape"></div>
                    <div class="btn-content">
                        <span class="btn-text-en">SKILLS</span>
                        <span class="btn-text-jp">スキル</span>
                    </div>
                </button>
            </div>

            <!-- Bottom -->
            <div class="diamond-btn-wrapper bottom">
                <button class="diamond-btn" data-page="resume">
                    <div class="diamond-shape"></div>
                    <div class="btn-content">
                        <span class="btn-text-en">RESUME</span>
                        <span class="btn-text-jp">履歴書</span>
                    </div>
                </button>
            </div>
        </div>
    </nav>

    <!-- Vertical neon street signs, left and right (decoration only) -->
    <div class="sign sign-left" aria-hidden="true"><span>作品集</span></div>
    <div class="sign sign-right" aria-hidden="true"><span>無限</span></div>

    <!-- HUD, top left: the current objective -->
    <div class="objective" aria-hidden="true">
        <span class="obj-tag"><b>OBJECTIVE</b><em>目的</em></span>
        <span class="obj-text"><i></i>Choose where to go</span>
    </div>

<!-- Help line: describes whichever diamond you point at (script.js fills it in) -->
    <div class="help-text" id="helpText" aria-live="polite">Select a destination.</div>

    <!-- HUD, top right: where you are + the time (the clock is filled in by script.js) -->
    <div class="hud-top" aria-hidden="true">
        <div class="hud-area"><span class="hud-en">HOME</span><span class="hud-jp">ホーム</span></div>
        <div class="hud-time" id="hudTime">&nbsp;</div>
    </div>

    <!-- Key hints, bottom (same bar as the other pages) -->
    <footer class="hint-bar">
        <span class="hint">
            <kbd class="key">&uarr;</kbd><kbd class="key">&larr;</kbd><kbd class="key">&darr;</kbd><kbd class="key">&rarr;</kbd>
            Select
        </span>
        <span class="hint"><kbd class="key key-wide">Enter</kbd> Open</span>
        <span class="spacer"></span>
        <span class="hint"><kbd class="key">F</kbd> Fullscreen</span>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
